name: Publish Docker image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/macokay/proxmox-hive
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Resolve app version
        id: appver
        run: |
          DESC=$(git describe --tags --always 2>/dev/null || echo "dev")
          SHA=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == "refs/heads/dev" ]]; then
            # Dev builds always carry SHA so they never look like a clean release
            if [[ "$DESC" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
              echo "value=${BASH_REMATCH[1]}-${SHA}" >> $GITHUB_OUTPUT
            else
              echo "value=${SHA}" >> $GITHUB_OUTPUT
            fi
          elif [[ "$DESC" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "value=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          elif [[ "$DESC" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-[0-9]+-g([a-f0-9]+)$ ]]; then
            echo "value=${BASH_REMATCH[1]}-${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
          else
            echo "value=${DESC#v}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.appver.outputs.value }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
